name: CodeQL

# Static analysis of the Python code and of the GitHub Actions workflows (F1-T00h).
# Results appear in the Security tab under Code scanning.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so new CodeQL queries also run on code that has not changed.
    - cron: "17 6 * * 1"

# Supply chain rules (ADR-012): actions pinned by full commit hash, minimal permissions.
permissions: {}

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to upload the results to Code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # "actions" analyzes the workflow files themselves (for example script injection).
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
