[project]
name = "atalaya"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[tool.ruff]
target-version = "py314"
src = ["services/ingestion"]

[tool.ruff.lint]
# pycodestyle errors, Pyflakes, import sorting, bugbear, pyupgrade.
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["services/ingestion"]
markers = ["data: needs local raw data un data/raw (skipped when missing)"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
